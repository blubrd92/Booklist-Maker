<!doctype html>
<!--
  Booklister promo video scene. Rendered frame by frame by build.mjs:
  window.renderAt(t) draws the frame at time t (seconds). There is no
  CSS animation or transition anywhere in this file, so any frame can be
  reproduced exactly. window.getCues() hands the soundtrack generator the
  same timeline the picture uses.

  Tokens replaced by build.mjs: the font-face comment in <style> and the
  shots comment in the first <script> (the manifest of real app frames
  filmed by capture.mjs).

  Folio's drawing is the one in index.html (same paths, colors and
  proportions); only the rig is new. Everything that moves is posed per
  frame: head, ears, eyes, mouth, breathing, leaps, and the jointed
  spring tail ported from assets/js/folio.js.
-->

/* =====================================================================

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const mod = (a, n) => ((a % n) + n) % n;
const E = {
  lin: (t) => t,
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: (t) => 1 - Math.pow(1 - t, 3),
  in: (t) => t * t * t,
  sine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  outQuint: (t) => 1 - Math.pow(1 - t, 5),
  outBack: (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outSoftBack: (t) => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

  let s = seed | 0;

    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

// Keyframe track: keys = [[t, value, ease?], ...]; value may be a number or array.
function track(keys) {
  return (t) => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t < keys[i][0]) {
        const [t0, v0] = keys[i - 1];
        const [t1, v1, e] = keys[i];

function wrapTitle(title, maxChars) {
  const words = title.split(' ');
  const lines = [];
  let cur = '';
  words.forEach((w) => {
    if (cur && (cur + ' ' + w).length > maxChars) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;

function countSyl(tok) {
  const w = tok.replace(/[*.,!?…]/g, '');
  if (/^\d+$/.test(w)) return { '600': 4 }[w] || w.length;
  if (/^[A-Z]{2,4}$/.test(w)) return w.length;
  const parts = w.toLowerCase().split(/[-']/).filter(Boolean);
  let n = 0;
  parts.forEach((p) => {
    const q = p.length > 3 ? p.replace(/e$/, '') : p;
    const m = q.match(/[aeiouy]+/g);
    n += Math.max(1, m ? m.length : 1);
  });
  return Math.max(1, n);
}
function vowelsOf(tok) {
  const m = tok.toLowerCase().match(/[aeiouy]+/g) || ['a'];
  return m.map((v) => v[0]);
}
function scheduleLines() {
  const r = rng(4242);
  const all = [];
  LINES.forEach((L, li) => {
    let t = L.t;
    L.words = [];
    L.syl = [];
    const toks = L.text.split(/\s+/);
    toks.forEach((tok) => {
      const pm = tok.match(/^\{([\d.]+)\}$/);
      if (pm) { t += parseFloat(pm[1]); return; }
      const n = countSyl(tok);
      const vs = vowelsOf(tok);
      const plain = tok.replace(/\*/g, '');
      const emph = tok.startsWith('*');
      const q = /\?\*?$/.test(tok), ex = /!\*?$/.test(tok);
      const w = { html: emph ? `<em>${plain}</em>` : plain, t, first: L.words.length === 0 };
      for (let k = 0; k < n; k++) {
        const d = 0.085 + r() * 0.035 + (emph ? 0.018 : 0);
        let p = (L.pitch || 0) + (r() * 4 - 2) + (k === 0 && n > 1 ? 1.5 : 0) + (emph ? 1.5 : 0);
        if (ex) p += 2;
        let glide = 0;
        if (k === n - 1 && q) { glide = 1; p += 1; }
        if (k === n - 1 && ex) glide = 0.6;
        const s = { t, dur: d, pitch: p, vowel: vs[k % vs.length], glide, line: li };
        L.syl.push(s);
        all.push(s);
        t += d + 0.018;
      }
      w.end = t;
      L.words.push(w);
      t += 0.055;
      if (/,\*?$/.test(tok)) t += 0.12;
      if (/\.\.\.\*?$/.test(tok)) t += 0.24;
      else if (/[.!?]\*?$/.test(tok)) t += 0.2;

}

// Camera: keys hold their framing until the next key starts moving.
const CAM_KEYS = (() => {
  const out = [];
  let last = CAMK[0][1];
  CAMK.slice().sort((a, b) => a[0] - b[0]).forEach(([t, v, e]) => { const val = v || last; out.push([t, val, e || 'inOut']); last = val; });
  return out;
})();
const camTrack = track(CAM_KEYS);
function camAt(t) {
  const [cx, cy, z] = camTrack(t);
  const hw = APP.w / 2 / z, hh = APP.h / 2 / z;
  return [clamp(cx, hw, APP.w - hw), clamp(cy, hh, APP.h - hh), z];
}
// App coordinates to stage coordinates, through the camera and the window.
function toStage(t, ax, ay) {
  const [cx, cy, z] = camAt(t);
  const off = winOffset(t);
  return [WIN.x + off[0] + WIN.w / 2 + (ax - cx) * APP_S * z, WIN.y + WIN.bar + off[1] + (WIN.h - WIN.bar) / 2 + (ay - cy) * APP_S * z];
}
function winOffset(t) {
  const inK = E.outQuint(seg(t, T.winIn, T.winIn + 0.75));
  const outK = E.in(seg(t, T.winOut, T.winOut + 0.5));
  return [700 * (1 - inK), 120 * outK];
}

function drawBackground() {
  const c = $('bg').getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, 1080);
  g.addColorStop(0, '#f7ecd6'); g.addColorStop(1, '#ecd8b6');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  // A bookcase along the back wall, drawn sharp and then blurred so it
  // reads as depth, not detail.
  const off = document.createElement('canvas'); off.width = 1920; off.height = 1080;
  const o = off.getContext('2d');
  const r = rng(77);
  const cols = ['#8c5a44', '#5a6f8c', '#7b8f5a', '#a0704a', '#6a5a7c', '#b08a4a', '#4f7470', '#9a5a5a', '#c7a36b', '#5b4a3a', '#3f51b5', '#e76f51'];
  o.fillStyle = '#c9a57c'; o.fillRect(0, 0, 1920, 1080);
  [300, 610, 920].forEach((y) => {
    let x = -10;
    while (x < 1930) {
      const w = 16 + r() * 26, h = 150 + r() * 95;
      if (r() < 0.07) { x += 30 + r() * 40; continue; }
      o.fillStyle = cols[Math.floor(r() * cols.length)];
      if (r() < 0.06) { o.save(); o.translate(x, y); o.rotate(-0.25); o.fillRect(0, -h, w, h); o.restore(); x += h * 0.3 + w; continue; }
      o.fillRect(x, y - h, w, h);
      o.fillStyle = 'rgba(255,255,255,.18)'; o.fillRect(x + w * 0.2, y - h + 18, w * 0.6, 5); o.fillRect(x + w * 0.2, y - 30, w * 0.6, 4);
      x += w + 1.5;
    }
    o.fillStyle = '#8e6440'; o.fillRect(0, y, 1920, 22);
    o.fillStyle = 'rgba(0,0,0,.18)'; o.fillRect(0, y + 22, 1920, 10);
  });
  c.save(); c.filter = 'blur(9px)'; c.globalAlpha = 0.3; c.drawImage(off, 0, 0); c.restore();
  // warm bokeh
  const rb = rng(9);
  for (let i = 0; i < 18; i++) {
    const x = rb() * 1920, y = rb() * 760, rad = 30 + rb() * 70;
    const bg = c.createRadialGradient(x, y, 0, x, y, rad);
    bg.addColorStop(0, 'rgba(255,236,190,.22)'); bg.addColorStop(1, 'rgba(255,236,190,0)');
    c.fillStyle = bg; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  // wash, so the shelves sit back
  c.fillStyle = 'rgba(248,238,218,.42)'; c.fillRect(0, 0, 1920, 1080);
  const v = c.createRadialGradient(960, 480, 300, 960, 540, 1250);
  v.addColorStop(0, 'rgba(90,60,30,0)'); v.addColorStop(1, 'rgba(90,60,30,.28)');
  c.fillStyle = v; c.fillRect(0, 0, 1920, 1080);
  const cs = c.createLinearGradient(0, 850, 0, 900);
  cs.addColorStop(0, 'rgba(80,50,20,0)'); cs.addColorStop(1, 'rgba(80,50,20,.16)');
  c.fillStyle = cs; c.fillRect(0, 850, 1920, 50);
}

/* ---------- the tail: jointed springs, ported from folio.js ---------- */
const TAIL_REST = [

  [109, 292], [102, 270], [94, 249], [85, 230], [77, 212], [73, 197], [74, 184],

const TAIL_SEGS = TAIL_REST.length - 1;

const TAIL_MAX_LAG = 0.24;
const TAIL_MOODS = {
  idle: { amp: 1.4, period: 3.8, curl: 1.0, bend: 1.0, lean: 0, sweep: 0, quiver: 0 },
  searching: { amp: 0.4, period: 2.4, curl: 1.15, bend: 0.95, lean: -14, sweep: 0, quiver: 0 },
  excited: { amp: 0.6, period: 1.8, curl: 1.35, bend: 0.45, lean: 12, sweep: 0, quiver: 1.6 },
  evaluating: { amp: 1.2, period: 5.0, curl: 1.25, bend: 1.0, lean: 2, sweep: 3, quiver: 0 },
  greeting: { amp: 0.8, period: 2.2, curl: 1.4, bend: 0.5, lean: 10, sweep: 0, quiver: 1.2 },
  content: { amp: 1.0, period: 2.8, curl: 1.45, bend: 0.7, lean: 6, sweep: 2, quiver: 0.6 },

const tailLen = [], tailRel = [];
let tailRootRest = 0;
for (let i = 0; i < TAIL_SEGS; i++) {
  const [x0, y0] = TAIL_REST[i], [x1, y1] = TAIL_REST[i + 1];
  tailLen.push(Math.hypot(x1 - x0, y1 - y0));
  const ang = Math.atan2(y1 - y0, x1 - x0);
  if (i === 0) { tailRootRest = ang; tailRel.push(0); } else {
    const [px, py] = TAIL_REST[i - 1];
    let rel = ang - Math.atan2(y0 - py, x0 - px);
    if (rel > Math.PI) rel -= 2 * Math.PI;
    if (rel < -Math.PI) rel += 2 * Math.PI;
    tailRel.push(rel);

}
const TAIL_FLICKS = (() => { const r = rng(99); const out = []; let t = 2; while (t < DURATION) { out.push([t, (r() < 0.5 ? -1 : 1) * (1.6 + r() * 1.6)]); t += 3.5 + r() * 4; } return out; })();
const tail = { t: -1, ang: [], vel: [], cur: null, phase: 0, qphase: 0, inert: 0, flick: 0 };
function moodAt(t) { let m = 'idle'; MOODS.forEach(([mt, name]) => { if (t >= mt) m = name; }); return m; }

    + ' C ' + f1(lt[0] + tx) + ' ' + f1(lt[1] + ty) + ', ' + f1(rt[0] + tx) + ' ' + f1(rt[1] + ty) + ', ' + f1(rt[0]) + ' ' + f1(rt[1])

  C.faceShades.forEach((s, i) => setO(s, i % 2 === 0 ? shadeFlip : Math.max(shadeFlip, shadeFold)));
  const shV = t > T.stand ? E.out(seg(t, T.stand + 0.3, T.stand + 0.8)) : 0;
  const shX = lerp(1180, 1590, outro), shW = lerp(420, 300, outro);
  C.sheetShadow.style.cssText = `left:${f1(shX - shW / 2)}px;top:${f1(lerp(842, 884, outro))}px;width:${f1(shW)}px;height:34px;opacity:${shV.toFixed(3)}`;
  const st = seg(t, T.stamp, T.stamp + 0.22);
  const stOut = seg(t, T.flip - 0.1, T.flip + 0.15);
  setO(C.stamp, t > T.stamp ? Math.min(st * 3, 1 - stOut) : 0);
  setT(C.stamp, `translate(1455px, 72px) rotate(-14deg) scale(${lerp(2.4, 1, E.outBack(st)).toFixed(3)})`);
  const tk = E.outBack(seg(t, 52.0, 52.4));
  setO(C.takeone, t > 52.0 ? 1 : 0);
  setT(C.takeone, `translate(1640px, 408px) rotate(${f1(-6 + Math.sin(t * 2) * 1.5)}deg) scale(${tk.toFixed(3)})`);
}

/* ---------------- speech bubble ---------------- */
function renderBubble(t) {
  const B = $('bubble');
  const L = LINES.find((l) => t >= l.t - 0.12 && t < l.end);
  if (!L) { setO(B, 0); C.bubbleLine = null; return; }
  if (C.bubbleLine !== L.id) {
    B.innerHTML = L.words.map((w, i) => `<span class="w">${i ? ' ' : ''}${w.html}</span>`).join('');
    C.bubbleSpans = Array.from(B.querySelectorAll('.w'));
    C.bubbleLine = L.id;
    C.bubbleW = B.offsetWidth; C.bubbleH = B.offsetHeight;
  }
  L.words.forEach((w, i) => {
    const k = seg(t, w.t - 0.02, w.t + 0.13);
    setO(C.bubbleSpans[i], k);
    setT(C.bubbleSpans[i], `translateY(${f1(8 * (1 - E.out(k)))}px)`);
  });
  const h = C.catState;
  const headTop = h.y - 432 * h.s;
  const bx = clamp(h.x, 30 + C.bubbleW / 2, 1890 - C.bubbleW / 2);
  const tailOff = clamp(h.x - bx, -C.bubbleW / 2 + 50, C.bubbleW / 2 - 50);
  B.style.setProperty('--tail', f1(tailOff) + 'px');
  const inK = E.outBack(seg(t, L.t - 0.12, L.t + 0.2)), outK = E.in(seg(t, L.end - 0.22, L.end));
  const s = (0.55 + 0.45 * inK) * (1 - 0.15 * outK);
  B.style.transformOrigin = `${f1(C.bubbleW / 2 + tailOff)}px ${C.bubbleH + 30}px`;
  setT(B, `translate(${f1(bx - C.bubbleW / 2)}px, ${f1(headTop - 28 - C.bubbleH)}px) scale(${s.toFixed(3)})`);
  setO(B, Math.min(seg(t, L.t - 0.12, L.t + 0.02), 1 - outK));
}

/* =====================================================================
   FRAME
   ===================================================================== */
async function renderAt(t) {
  renderAmbient(t);
  renderLogo(t);
  renderChapter(t);
  await renderApp(t);
  renderOverlays(t);
  renderPrint(t);
  renderCat(t);
  renderBubble(t);
  renderCursor(t);
  renderParticles(t);
  setO($('fade'), Math.max(1 - seg(t, 0, 0.5), E.inOut(seg(t, T.fadeOut, DURATION))));
}

function getCues() {
  return {
    duration: DURATION,
    syllables: SYL.map((s) => ({ t: +s.t.toFixed(4), dur: +s.dur.toFixed(4), pitch: +s.pitch.toFixed(3), vowel: s.vowel, glide: s.glide })),
    sfx: SFX.slice().sort((a, b) => a.t - b.t),
    transitions: [T.winIn, T.edit, T.fcTab, T.toStyle, T.winOut, T.hopOut],
    lines: LINES.map((l) => ({ id: l.id, t: l.t, speechEnd: l.speechEnd, end: l.end })),
  };
}

async function init() {
  buildCoverSymbols();
  drawBackground();
  drawDesk();
  buildProps();
  buildLogo();
  buildAppWindow();
  buildPrint();
  buildCat();
  buildParticles();
  buildCursor();
  const faces = ['600 40px Caveat', '700 40px Caveat', '400 20px Inter', '500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter',
    'italic 500 20px "EB Garamond"', '700 20px "Playfair Display"', '900 20px "Playfair Display"', '700 20px Lora', '600 20px Lora', 'italic 400 20px Lora',
    '400 20px "Bebas Neue"', '400 20px Pacifico', '400 20px "Abril Fatface"', '600 20px Fredoka', '700 20px "Josefin Sans"', '600 20px Oswald',
    '700 20px Cinzel', '400 20px "Special Elite"', '700 20px "Libre Baskerville"'];
  await Promise.all(faces.map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  C.logoW = C.logo.offsetWidth;
  await renderAt(0);
  window.sceneReady = true;
}
// Used by build.mjs before filming: the invented titles, and each cover
// drawn alone at 600x900 so the real app can be handed them as images.
window.getCastData = () => ({
  books: BOOKS.map((b) => ({ t: b.t, a: b.a, c: b.c, d: b.d })),
  search: SEARCH, pasted: PASTED,
});
window.showCoverForCapture = (i) => {
  let host = document.getElementById('coverCapture');
  if (!host) {
    host = document.createElement('div');
    host.id = 'coverCapture';
    host.style.cssText = 'position:fixed;left:0;top:0;width:600px;height:900px;z-index:99999;background:#fff';
    document.body.appendChild(host);
  }
  host.innerHTML = `<svg viewBox="0 0 300 450" width="600" height="900" preserveAspectRatio="xMidYMid slice"><use href="#cov${i}"/></svg>`;
};
window.renderAt = renderAt;
window.getCues = getCues;
window.SCENE_DURATION = DURATION;
init();
</script>
