<!doctype html>
<!--
  Booklister promo video scene. Rendered frame by frame by build.mjs:
  window.renderAt(t) draws the frame at time t (seconds). There is no
  CSS animation or transition anywhere in this file, so any frame can be
  reproduced exactly. window.getCues() hands the soundtrack generator the
  same timeline the picture uses.

  Tokens replaced by build.mjs: the font-face comment in <style> and the
  QR data comment in the first <script> (the module matrix for a real,
  scannable code to booklister.org).

  Folio's drawing is the one in index.html (same paths, colors and
  proportions); only the rig is new. Everything that moves is posed per
  frame: head, ears, eyes, mouth, breathing, leaps, and the jointed
  spring tail ported from assets/js/folio.js.
-->

<script>
'use strict';
/* =====================================================================
   UTILITIES
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: (t) => t,
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: (t) => 1 - Math.pow(1 - t, 3),
  in: (t) => t * t * t,
  sine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  outQuint: (t) => 1 - Math.pow(1 - t, 5),
  outBack: (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outSoftBack: (t) => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 8 - 0.75) * (2 * Math.PI / 3)) + 1),
};
function rng(seed) {
  let s = seed | 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Keyframe track: keys = [[t, value, ease?], ...]; value may be a number or array.
function track(keys) {
  return (t) => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t < keys[i][0]) {
        const [t0, v0] = keys[i - 1];
        const [t1, v1, e] = keys[i];
        const u = E[e || 'inOut']((t - t0) / (t1 - t0));
        return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], u)) : lerp(v0, v1, u);
      }
    }
    return keys[keys.length - 1][1];
  };
}
// Appear / disappear envelope: 0 before a, eased 0..1 over fin, 1, then out over fout ending at b.
function env(t, a, b, fin = 0.4, fout = 0.35, ein = 'outBack', eout = 'in') {
  if (t < a || t > b) return 0;
  if (t < a + fin) return E[ein](seg(t, a, a + fin));
  if (t > b - fout) return 1 - E[eout](seg(t, b - fout, b));
  return 1;
}
function setT(el, tf) { if (el._tf !== tf) { el.style.transform = tf; el._tf = tf; } }
function setO(el, o) {
  o = Math.round(clamp(o) * 1000) / 1000;
  if (el._o !== o) { el.style.opacity = o; el.style.visibility = o <= 0 ? 'hidden' : 'visible'; el._o = o; }
}
function setA(el, name, v) { if (el['_a_' + name] !== v) { el.setAttribute(name, v); el['_a_' + name] = v; } }
function setH(el, html) { if (el._h !== html) { el.innerHTML = html; el._h = html; } }
const f1 = (v) => (Math.round(v * 10) / 10).toString();
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function div(cls, parent, html) {
  const el = document.createElement('div');
  if (cls) el.className = cls;
  if (html != null) el.innerHTML = html;
  if (parent) parent.appendChild(el);
  return el;
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return '#' + A.map((x, i) => Math.round(lerp(x, B[i], t)).toString(16).padStart(2, '0')).join('');
}

function wrapTitle(title, maxChars) {
  const words = title.split(' ');
  const lines = [];
  let cur = '';
  words.forEach((w) => {
    if (cur && (cur + ' ' + w).length > maxChars) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
  });
  if (cur) lines.push(cur);
  return lines;
}

function buildCoverSymbols() {
  const defs = document.getElementById('coverDefs');
  let html = '';
  BOOKS.forEach((b, i) => {
    const maxChars = b.k < 0.5 ? 14 : b.k > 0.7 ? 9 : 11;
    const lines = wrapTitle(b.t, maxChars);
    const longest = Math.max(...lines.map((l) => l.length));
    const fs = Math.min(58, 262 / (longest * b.k));
    const lh = fs * 1.08;
    let tx = '';
    const upper = b.m === 'moon' || b.f === "'Cinzel'" || b.f === "'Bebas Neue'" || b.f === "'Oswald'";
    const y0 = b.tp === 'top' ? 36 + fs : 408 - lh * (lines.length - 1);
    lines.forEach((l, k) => {
      tx += `<text x="150" y="${(y0 + k * lh).toFixed(1)}" text-anchor="middle" font-family="${b.f.replace(/'/g, '')}" font-weight="${b.fw}" font-size="${fs.toFixed(1)}" fill="${b.fg}">${upper ? l.toUpperCase() : l}</text>`;
    });
    const ay = b.tp === 'top' ? 428 : 40;
    tx += `<text x="150" y="${ay}" text-anchor="middle" font-family="Inter" font-weight="600" font-size="14" letter-spacing="2.4" fill="${b.fg}" opacity=".85">${b.a.toUpperCase()}</text>`;

function countSyl(tok) {
  const w = tok.replace(/[*.,!?…]/g, '');
  if (/^\d+$/.test(w)) return { '600': 4 }[w] || w.length;
  if (/^[A-Z]{2,4}$/.test(w)) return w.length;
  const parts = w.toLowerCase().split(/[-']/).filter(Boolean);
  let n = 0;
  parts.forEach((p) => {
    const q = p.length > 3 ? p.replace(/e$/, '') : p;
    const m = q.match(/[aeiouy]+/g);
    n += Math.max(1, m ? m.length : 1);
  });
  return Math.max(1, n);
}
function vowelsOf(tok) {
  const m = tok.toLowerCase().match(/[aeiouy]+/g) || ['a'];
  return m.map((v) => v[0]);
}
function scheduleLines() {
  const r = rng(4242);
  const all = [];
  LINES.forEach((L, li) => {
    let t = L.t;
    L.words = [];
    L.syl = [];
    const toks = L.text.split(/\s+/);
    toks.forEach((tok) => {
      const pm = tok.match(/^\{([\d.]+)\}$/);
      if (pm) { t += parseFloat(pm[1]); return; }
      const n = countSyl(tok);
      const vs = vowelsOf(tok);
      const plain = tok.replace(/\*/g, '');
      const emph = tok.startsWith('*');
      const q = /\?\*?$/.test(tok), ex = /!\*?$/.test(tok);
      const w = { html: emph ? `<em>${plain}</em>` : plain, t, first: L.words.length === 0 };
      for (let k = 0; k < n; k++) {
        const d = 0.085 + r() * 0.035 + (emph ? 0.018 : 0);
        let p = (L.pitch || 0) + (r() * 4 - 2) + (k === 0 && n > 1 ? 1.5 : 0) + (emph ? 1.5 : 0);
        if (ex) p += 2;
        let glide = 0;
        if (k === n - 1 && q) { glide = 1; p += 1; }
        if (k === n - 1 && ex) glide = 0.6;
        const s = { t, dur: d, pitch: p, vowel: vs[k % vs.length], glide, line: li };
        L.syl.push(s);
        all.push(s);
        t += d + 0.018;
      }

const PW = 520, PH = 804;
function hexPts(R) { const s = 0.8660254 * R; return [[0, -R], [s, -R / 2], [s, R / 2], [0, R], [-s, R / 2], [-s, -R / 2]]; }
function rectPts(w, h) { return [[0, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [0, h / 2], [-w / 2, h / 2], [-w / 2, -h / 2]]; }
const mod = (a, n) => ((a % n) + n) % n;
function makeLayouts() {
  const L = {};
  { // classic 4x4 under a top bar
    const cells = [];
    const cw = 100, ch = 137.5, x0 = 39, y0 = 196;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      cells.push({ x: x0 + c * 114 + cw / 2, y: y0 + r * 149.5 + ch / 2, w: cw, h: ch, rot: 0, hex: 0, book: r * 4 + c });
    }
    L.classic = { cells, bar: { y: 26, h: 150, inset: 26, strip: 0 } };
  }
  { // tilted
    const cells = [];
    const rot = -9 * Math.PI / 180, cw = 110, ch = 160, sx = 122, sy = 172;
    for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) {
      const lx = i * sx + (mod(j, 2) ? sx / 2 : 0), ly = j * sy;
      const x = 260 + lx * Math.cos(rot) - ly * Math.sin(rot), y = 402 + lx * Math.sin(rot) + ly * Math.cos(rot);
      if (x < -70 || x > PW + 70 || y < -90 || y > PH + 90) continue;
      cells.push({ x, y, w: cw, h: ch, rot: -9, hex: 0, book: mod(i + j * 6 + 3, 16) });
    }
    L.tilted = { cells, bar: { y: 327, h: 150, inset: 18, strip: 1 } };
  }
  { // staggered
    const cells = [];
    const ys = [80, 240, 564, 724], offs = [-42, -96, -18, -70];
    ys.forEach((y, r) => {
      for (let c = 0; c < 6; c++) {
        const x = offs[r] + c * 114 + 52;
        if (x - 52 > PW) continue;
        cells.push({ x, y, w: 104, h: 150, rot: 0, hex: 0, book: mod(c + r * 6 + 9, 16) });

    const added = i < 3 && t > T.addClicks[i];
    setH(r.add, added ? 'Added' : 'Add');
    r.add.style.background = added ? '#c8e6c9' : '#43a047';
    r.add.style.color = added ? '#2e7d32' : '#fff';
    setT(r.add, `scale(${(i < 3 ? pressS(T.addClicks[i]) : 1).toFixed(3)})`);
    setO(r.th, i < 3 && t > T.addClicks[i] && t < T.fillAt[i] ? 0.35 : 1);
  });
  C.winPanels.forEach((pn, p) => pn.entries.forEach((e, kk) => {
    const k = p * 5 + kk;
    const f = seg(t, T.fillAt[k], T.fillAt[k] + 0.25);
    setO(e.blank, 1 - f); setO(e.filled, f);
    setT(e.cover, `scale(${(0.7 + 0.3 * E.outBack(seg(t, T.fillAt[k], T.fillAt[k] + 0.35))).toFixed(3)})`);
  }));
  // Quick Add modal
  const qin = E.outBack(seg(t, T.qaOpen, T.qaOpen + 0.35)), qout = E.in(seg(t, T.qaClose, T.qaClose + 0.2));
  const qv = t > T.qaOpen && t < T.qaClose + 0.2;
  setO(C.qa, qv ? Math.min(seg(t, T.qaOpen, T.qaOpen + 0.15), 1 - qout) : 0);
  setO(C.qaShade, qv ? 0.8 * Math.min(seg(t, T.qaOpen, T.qaOpen + 0.25), 1 - qout) : 0);
  setT(C.qa, `scale(${(0.9 + 0.1 * qin - 0.05 * qout).toFixed(3)})`);
  C.qaTa.classList.toggle('focus', t > 11.3);
  C.qaRows.forEach((row, j) => {
    const k = seg(t, T.pasteAt + j * T.rowStep, T.pasteAt + j * T.rowStep + 0.12);
    setO(row, k); setT(row, `translateX(${f1(-12 * (1 - k))}px)`);
  });
  setT(C.qaGo, `scale(${pressS(T.qaGo).toFixed(3)})`);
  // keycap
  const kc = env(t, T.pasteAt - 0.2, T.pasteAt + 0.55, 0.2, 0.2);
  setO(C.keycap, Math.min(1, kc)); setT(C.keycap, `translate(1236px, 486px) scale(${(0.7 + 0.3 * kc).toFixed(3)})`);
  // sticky note
  const sk = E.outBack(seg(t, T.stickyIn, T.stickyIn + 0.45));
  setO(C.sticky, t > T.stickyIn ? Math.min(seg(t, T.stickyIn, T.stickyIn + 0.2), 1 - seg(t, T.zoomStart, T.zoomStart + 0.35)) : 0);
  setT(C.sticky, `translateY(${f1(-60 * (1 - sk))}px) rotate(${f1(4 + 6 * (1 - sk))}deg)`);
}

function renderFlyers(t) {
  FLYERS.forEach((f, i) => {
    const el = C.flyers[i];
    const u = (t - f.t0) / f.dur;
    if (u < 0 || u >= 1) { setO(el, 0); return; }
    const k = E.inOut(u);
    const x = lerp(f.from[0], f.to[0], k), y = lerp(f.from[1], f.to[1], k) + f.arc * 4 * k * (1 - k);
    const w = lerp(f.from[2], f.to[2], k), h = lerp(f.from[3], f.to[3], k);
    const rot = Math.sin(Math.PI * u) * 10;
    setO(el, 1);
    setT(el, `translate(${f1(x - w / 2)}px, ${f1(y - h / 2)}px) rotate(${f1(rot)}deg) scale(${(w / 100).toFixed(4)}, ${(h / 150).toFixed(4)})`);
  });
}

const DISP = [0, 2, 1, 3, 4]; // display position -> entry index, after the drag
function renderList(t) {
  const z = zoomK(t);
  const Z = lerp(1, 0.92 / 0.77, z), tx = lerp(0, 820.8 - 610 - 409.6 * 0.92 / 0.77, z), ty = lerp(0, 110.2 - 96 - 94.5 * 0.92 / 0.77, z);
  const x = 610 + tx + 409.6 * Z, y = 96 + ty + 94.5 * Z, s = 0.77 * Z;
  const out = E.inOut(seg(t, T.panelOut, T.panelOut + 0.6));
  const vis = t > T.zoomStart && t < T.panelOut + 0.62;
  setO(C.listWrap, vis ? Math.min(seg(t, T.zoomStart + 0.05, T.zoomStart + 0.45), 1 - out) : 0);
  setT(C.listWrap, `translate(${f1(x - 300 * out)}px, ${f1(y)}px) scale(${s.toFixed(4)})`);
  // entries: filled; drag swap of entries 1 and 2
  const ents = C.list.entries;
  const du = E.inOut(seg(t, T.dragA, T.dragB)), mu = E.inOut(seg(t, T.dragA + 0.15, T.dragB + 0.05));
  const lifted = env(t, T.grab, T.drop + 0.1, 0.12, 0.15, 'out', 'out');
  ents.forEach((e, k) => {
    setO(e.blank, 0); setO(e.filled, 1);
    let dy = 0, sc = 1;
    if (k === 2) { dy = -152 * du; sc = 1 + 0.035 * lifted; }
    if (k === 1) dy = 152 * mu;
    setT(e.el, `translateY(${f1(dy)}px) scale(${sc.toFixed(3)})`);
    e.el.style.zIndex = k === 2 ? 2 : 1;
    e.el.style.boxShadow = k === 2 && lifted > 0 ? `0 ${f1(14 * lifted)}px ${f1(28 * lifted)}px rgba(0,0,0,${(0.2 * lifted).toFixed(3)})` : 'none';
    e.el.style.background = k === 2 && lifted > 0 ? '#fff' : 'transparent';
    setO(e.grip, env(t, 19.25, 20.6, 0.2, 0.3));
    // stars
    const di = DISP.indexOf(k);
    const si = T.starEntries.indexOf(di);
    const on = si >= 0 && t > T.stars[si];
    const pop = si >= 0 ? E.outBack(seg(t, T.stars[si], T.stars[si] + 0.35)) : 0;
    setA(e.starFill, 'visibility', on ? 'visible' : 'hidden');
    setA(e.starLine, 'visibility', on ? 'hidden' : 'visible');
    setT(e.star, `scale(${on ? (0.4 + 0.6 * pop + 0.25 * Math.sin(Math.PI * seg(t, T.stars[si], T.stars[si] + 0.35))).toFixed(3) : 1})`);
    setO(e.star, env(t, T.zoomStart + 0.2, T.panelOut + 0.2, 0.4, 0.2, 'out', 'in'));
  });
  // callouts
  C.callouts.forEach((c, i) => {
    const a = T.callouts[i];
    const k = env(t, a, T.calloutOut + 0.3 + i * 0.05, 0.45, 0.3);
    const draw = E.out(seg(t, a - 0.1, a + 0.3));
    [c.path, c.halo].forEach((el) => {
      setA(el, 'stroke-dasharray', `${f1(c.len * draw)} ${f1(c.len)}`);
      setA(el, 'opacity', Math.min(1, k * 2).toFixed(3));
    });
    setA(c.dot, 'opacity', Math.min(1, k * 2).toFixed(3));
    setA(c.dot, 'r', f1(8 * E.outBack(seg(t, a - 0.1, a + 0.2))));
    setO(c.el, Math.min(1, k * 1.5));
    setT(c.el, `translate(${c.x}px, ${c.y}px) scale(${(0.6 + 0.4 * k).toFixed(3)})`);
  });
  const dk = env(t, 19.55, 20.95, 0.4, 0.3);
  setO(C.dragTip, Math.min(1, dk * 1.5)); setT(C.dragTip, `translate(1330px, 380px) scale(${(0.6 + 0.4 * dk).toFixed(3)})`);
  const sk = env(t, T.stars[0] + 0.1, T.panelOut, 0.45, 0.3);
  setO(C.starTip, Math.min(1, sk * 1.5)); setT(C.starTip, `translate(1360px, 250px) scale(${(0.6 + 0.4 * sk).toFixed(3)})`);
}

const FONTS = [["'Playfair Display'", 900, 'Playfair Display'], ["'Bebas Neue'", 400, 'Bebas Neue'], ["'Pacifico'", 400, 'Pacifico'],
  ["'Fredoka'", 600, 'Fredoka'], ["'Abril Fatface'", 400, 'Abril Fatface']];
function coverStyleAt(t) {
  let fi = 0;
  T.fonts.forEach((tf, i) => { if (t >= tf) fi = i + 1; });
  const since = fi > 0 ? t - T.fonts[fi - 1] : 9;
  const bump = since < 0.3 ? 0.07 * Math.sin(Math.PI * since / 0.3) : 0;
  const k1 = seg(t, T.colors[0], T.colors[0] + 0.3), k2 = seg(t, T.colors[1], T.colors[1] + 0.3), k3 = seg(t, T.colors[2], T.colors[2] + 0.4);
  let c0 = mixHex('#3f51b5', '#2a9d8f', k1);
  c0 = mixHex(c0, '#6d4c7d', k2);
  const c1 = mixHex(c0, '#e76f51', k3);
  return { font: FONTS[fi][0], weight: FONTS[fi][1], label: FONTS[fi][2], c0, c1, bump, fi };
}
function layoutAt(t) {
  const steps = [['classic', 'tilted', T.tilt], ['tilted', 'staggered', T.stag], ['staggered', 'honeycomb', T.honey]];
  let a = 'classic', b = 'classic', u = 0;
  steps.forEach(([from, to, ts]) => {
    if (t >= ts) { a = from; b = to; u = seg(t, ts, ts + T.layoutDur); }
  });
  return { a, b, u };
}
function renderCover(t) {
  const inK = E.outBack(seg(t, T.pageIn, T.pageIn + 0.55));
  const sh = E.inOut(seg(t, T.toStyle, T.toStyle + 0.65));
  const outK = E.inOut(seg(t, T.styleOut, T.styleOut + 0.5));
  const vis = t > T.pageIn && t < T.styleOut + 0.5;
  const cx = lerp(1130, 1010, sh), s = 0.95 * (0.85 + 0.15 * inK) * (1 - 0.15 * outK);
  const ox = cx - PW * s / 2, oy = 482 - PH * s / 2 - 90 * outK;
  setO(C.coverWrap, vis ? Math.min(seg(t, T.pageIn, T.pageIn + 0.2), 1 - outK) : 0);
  setT(C.coverWrap, `translate(${f1(ox)}px, ${f1(oy)}px) scale(${s.toFixed(4)})`);
  if (vis) {
    const L = layoutAt(t);
    const style = coverStyleAt(t);
    drawCoverPage(C.page, {
      a: L.a, b: L.b, u: L.u, style,
      enter: (i) => {
        if (L.a !== 'classic' || L.b !== 'classic') return null;
        if (i < 3) { const f = FLYERS[FLYERS.length - 3 + i]; return t >= f.t0 + f.dur ? 1 : 0; }
        const tp = T.coverPops + (i - 3) * 0.055;
        return E.outBack(seg(t, tp, tp + 0.35));
      },
    });
    setH(C.fname, style.label);
    C.fname.style.fontFamily = style.font;
    C.fname.style.fontWeight = style.weight;
    const ring = style.fi >= 0 ? (t < T.colors[0] ? 0 : t < T.colors[1] ? 2 : 4) : 0;
    setT(C.swring, `translate(${24 + 70 * ring}px, 318px)`);
    const tg = E.out(seg(t, T.colors[2], T.colors[2] + 0.2));
    setT(C.toggleKnob, `translateX(${f1(28 * tg)}px)`);
    C.toggle.style.background = mixHex('#cfd6e0', '#5c6bc0', tg);
  }
  // layout picker
  const pk = env(t, T.pickerIn, T.toStyle + 0.3, 0.5, 0.35, 'outQuint', 'in');
  setO(C.picker, Math.min(1, pk * 1.5));
  setT(C.picker, `translateX(${f1(80 * (1 - pk))}px)`);
  const rowOf = { classic: 0, honeycomb: 1, staggered: 4, tilted: 5 };
  const L2 = layoutAt(t);
  const fromR = rowOf[L2.a], toR = rowOf[L2.b];
  const hr = lerp(fromR, toR, E.out(clamp(L2.u * 4)));
  setT(C.lhi, `translateY(${f1(84 + 88 * hr)}px)`);
  C.lrows.forEach((row, r) => { row.style.color = Math.abs(hr - r) < 0.5 ? '#3f51b5' : '#546e7a'; });
  // style panel + QR card
  const sp = env(t, T.toStyle + 0.2, T.styleOut + 0.3, 0.5, 0.3, 'outQuint', 'in');
  setO(C.style, Math.min(1, sp * 1.5)); setT(C.style, `translateX(${f1(90 * (1 - sp))}px)`);
  const qk = env(t, T.qrIn, T.styleOut + 0.35, 0.5, 0.3, 'outQuint', 'in');
  setO(C.qrCard, Math.min(1, qk * 1.5)); setT(C.qrCard, `translateY(${f1(80 * (1 - qk))}px)`);
  if (t > T.qrIn - 0.1 && t < T.qrBuild + 1.6) {
    const q = (t - T.qrBuild) / 1.1;
    C.qrMods.forEach((m) => setA(m.el, 'opacity', clamp((q - m.d * 0.85) * 8).toFixed(2)));
  }
}

function renderPrint(t) {
  // Generate PDF button
  const bIn = E.outBack(seg(t, T.pdfIn, T.pdfIn + 0.45));
  const morph = E.inOut(seg(t, T.pdfClick + 0.05, T.pdfClick + 0.35));
  const bOut = E.in(seg(t, T.sheetOut - 0.25, T.sheetOut + 0.05));
  const bw = lerp(430, 96, morph);
  const bv = t > T.pdfIn && t < T.sheetOut + 0.05;
  const press = 1 - 0.06 * Math.max(0, 1 - Math.abs(t - T.pdfClick - 0.02) / 0.1);
  C.pdfbtn.style.width = f1(bw) + 'px';
  setO(C.pdfbtn, bv ? Math.min(seg(t, T.pdfIn, T.pdfIn + 0.15), 1 - bOut) : 0);
  setT(C.pdfbtn, `translate(${f1(1180 - bw / 2)}px, ${f1(282)}px) scale(${(bIn * press * (1 - 0.6 * bOut)).toFixed(3)})`);
  setO(C.pdfLabel, 1 - morph); setO(C.pdfIcon, 1 - morph);
  setO(C.spin, bv && morph > 0.9 ? 1 - bOut : 0);
  setT(C.spin, `translate(1150px, 300px) rotate(${f1((t - T.pdfClick) * 540)}deg)`);
  C.spin.style.transformOrigin = '30px 30px';
  setA(C.spinArc, 'stroke-dasharray', `${f1(30 + 40 * Math.sin((t - T.pdfClick) * 6) ** 2)} 200`);
  // printer
  const up = E.outBack(seg(t, T.printerUp, T.printerUp + 0.55)), down = E.in(seg(t, T.sheetLift + 0.35, T.sheetLift + 0.9));
  const py = 300 * (1 - up) + 320 * down;
  const pv = t > T.printerUp && t < T.sheetLift + 0.9;
  setA(C.printerBack, 'transform', `translate(0 ${f1(py)})`); setA(C.printerFront, 'transform', `translate(0 ${f1(py)})`);
  setA(C.printerBack, 'visibility', pv ? 'visible' : 'hidden'); setA(C.printerFront, 'visibility', pv ? 'visible' : 'hidden');
  setA(C.printLed, 'fill', t > T.sheetOut && t < T.sheetOutEnd && Math.floor(t * 6) % 2 ? '#a5d6a7' : '#43a047');
  // sheet
  const p = seg(t, T.sheetOut, T.sheetOutEnd);
  const printing = t < T.sheetOutEnd;
  const lift = E.inOut(seg(t, T.sheetLift, T.sheetLift + 0.5));
  const flip = E.inOut(seg(t, T.flip, T.flip + 0.8));
  const fold = E.inOut(seg(t, T.fold, T.fold + 0.8));
  const stand = E.inOut(seg(t, T.stand, T.stand + 0.8));
  const outro = E.inOut(seg(t, T.hopOut, T.hopOut + 0.9));
  let dy = printing ? (778 - 680 * E.sine(p)) - 140 : lerp(778 - 680 - 140, 10, lift);
  let dx = 0, sc = printing ? 1 : lerp(1, 0.94, lift);
  const ry = 180 * flip - 16 * stand + 6 * outro;
  const rx = 4 * stand;
  // Once folded, the booklet is the viewer-right half: re-centre it.
  const bookX = lerp(lerp(0, -220, stand), 1590 - 1180 - 220 * 0.62, outro);
  const bookY = lerp(lerp(dy, 50, stand), 690 - 480, outro);
  if (t >= T.stand) { dx = bookX; dy = bookY; sc = lerp(lerp(0.94, 0.92, stand), 0.62, outro); }
  const zlift = 140 * Math.sin(Math.PI * flip);
  let shake = 0;
  if (t > T.stamp && t < T.stamp + 0.2) shake = Math.sin((t - T.stamp) * 90) * 5 * (1 - (t - T.stamp) / 0.2);
  const sv = t > T.sheetOut;
  setO(C.sheet, sv ? 1 : 0);
  setT(C.sheet, `translate3d(${f1(dx + shake)}px, ${f1(dy)}px, ${f1(zlift)}px) rotateY(${f1(ry)}deg) rotateX(${f1(rx)}deg) scale(${sc.toFixed(4)})`);
  setT(C.halfR, `translateZ(-2px) rotateY(${f1(180 * fold)}deg)`);
  // light falloff as the pages turn
  const shadeFlip = 0.35 * Math.abs(Math.sin(Math.PI * flip)), shadeFold = 0.3 * Math.abs(Math.sin(Math.PI * fold));
  C.faceShades.forEach((s, i) => setO(s, i % 2 === 0 ? shadeFlip : Math.max(shadeFlip, shadeFold)));
  // shadow under the standing booklet
  const shV = t > T.stand ? E.out(seg(t, T.stand + 0.3, T.stand + 0.8)) : 0;
  const shX = lerp(1180, 1590, outro), shW = lerp(420, 300, outro);
  C.sheetShadow.style.cssText = `left:${f1(shX - shW / 2)}px;top:${f1(lerp(842, 884, outro))}px;width:${f1(shW)}px;height:34px;opacity:${shV.toFixed(3)}`;
  // 600 DPI stamp
  const st = seg(t, T.stamp, T.stamp + 0.22);
  const stOut = seg(t, T.flip - 0.1, T.flip + 0.15);
  setO(C.stamp, t > T.stamp ? Math.min(st * 3, 1 - stOut) : 0);
  setT(C.stamp, `translate(1455px, 72px) rotate(-14deg) scale(${lerp(2.4, 1, E.outBack(st)).toFixed(3)})`);
  // take one card
  const tk = E.outBack(seg(t, 52.0, 52.4));
  setO(C.takeone, t > 52.0 ? 1 : 0);
  setT(C.takeone, `translate(1640px, 408px) rotate(${f1(-6 + Math.sin(t * 2) * 1.5)}deg) scale(${tk.toFixed(3)})`);
}

/* ---------------- speech bubble ---------------- */
function renderBubble(t) {
  const B = $('bubble');
  const L = LINES.find((l) => t >= l.t - 0.12 && t < l.end);
  if (!L) { setO(B, 0); C.bubbleLine = null; return; }
  if (C.bubbleLine !== L.id) {
    B.innerHTML = L.words.map((w, i) => `<span class="w">${i ? ' ' : ''}${w.html}</span>`).join('');
    C.bubbleSpans = Array.from(B.querySelectorAll('.w'));
    C.bubbleLine = L.id;
    C.bubbleW = B.offsetWidth; C.bubbleH = B.offsetHeight;
  }
  L.words.forEach((w, i) => {
    const k = seg(t, w.t - 0.02, w.t + 0.13);
    setO(C.bubbleSpans[i], k);
    setT(C.bubbleSpans[i], `translateY(${f1(8 * (1 - E.out(k)))}px)`);
  });
  const h = C.catState;
  const headTop = h.y - 432 * h.s;
  const bx = clamp(h.x, 30 + C.bubbleW / 2, 1890 - C.bubbleW / 2);
  const tailOff = clamp(h.x - bx, -C.bubbleW / 2 + 50, C.bubbleW / 2 - 50);
  B.style.setProperty('--tail', f1(tailOff) + 'px');
  const inK = E.outBack(seg(t, L.t - 0.12, L.t + 0.2)), outK = E.in(seg(t, L.end - 0.22, L.end));
  const s = (0.55 + 0.45 * inK) * (1 - 0.15 * outK);
  B.style.transformOrigin = `${f1(C.bubbleW / 2 + tailOff)}px ${C.bubbleH + 30}px`;
  setT(B, `translate(${f1(bx - C.bubbleW / 2)}px, ${f1(headTop - 28 - C.bubbleH)}px) scale(${s.toFixed(3)})`);
  setO(B, Math.min(seg(t, L.t - 0.12, L.t + 0.02), 1 - outK));
}

/* =====================================================================
   FRAME
   ===================================================================== */
function renderAt(t) {
  renderAmbient(t);
  renderLogo(t);
  renderChapter(t);
  renderWindow(t);
  renderList(t);
  renderFlyers(t);
  renderCover(t);
  renderPrint(t);
  renderCat(t);
  renderBubble(t);
  renderCursor(t);
  renderParticles(t);
  setO($('fade'), Math.max(1 - seg(t, 0, 0.5), E.inOut(seg(t, T.fadeOut, DURATION))));
}

function getCues() {
  return {
    duration: DURATION,
    syllables: SYL.map((s) => ({ t: +s.t.toFixed(4), dur: +s.dur.toFixed(4), pitch: +s.pitch.toFixed(3), vowel: s.vowel, glide: s.glide })),
    sfx: SFX.slice().sort((a, b) => a.t - b.t),
    transitions: [T.winIn, T.zoomStart, T.panelOut, T.toStyle, T.styleOut, T.hopOut],
    lines: LINES.map((l) => ({ id: l.id, t: l.t, speechEnd: l.speechEnd, end: l.end })),
  };
}

async function init() {
  buildCoverSymbols();
  drawBackground();
  drawDesk();
  buildProps();
  buildLogo();
  buildWindow();
  buildListPanel();
  buildCoverScene();
  buildPrint();
  buildFlyers();
  buildCat();
  buildParticles();
  buildCursor();
  const faces = ['600 40px Caveat', '700 40px Caveat', '400 20px Inter', '500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter',
    'italic 500 20px "EB Garamond"', '700 20px "Playfair Display"', '900 20px "Playfair Display"', '700 20px Lora', '600 20px Lora', 'italic 400 20px Lora',
    '400 20px "Bebas Neue"', '400 20px Pacifico', '400 20px "Abril Fatface"', '600 20px Fredoka', '700 20px "Josefin Sans"', '600 20px Oswald',
    '700 20px Cinzel', '400 20px "Special Elite"', '700 20px "Libre Baskerville"'];
  await Promise.all(faces.map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  C.logoW = C.logo.offsetWidth;
  drawCoverPage(C.frontCopy, { a: 'honeycomb', b: 'honeycomb', u: 1, style: coverStyleAt(DURATION) });
  renderAt(0);
  window.sceneReady = true;
}
window.renderAt = renderAt;
window.getCues = getCues;
window.SCENE_DURATION = DURATION;
init();
</script>
